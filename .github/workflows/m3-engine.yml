name: m3-engine
# The M3 engine verification suite: differential tests (interpreter oracle vs
# hardware stepper vs AOT wasm, bit-exact) plus every regression the real-app
# work has accumulated (lea sizes, entry-live flags, mul/bt flags, ...).
on:
  push:
    paths: ['oxwasm/engine/**', '.github/workflows/m3-engine.yml']
  pull_request:
    paths: ['oxwasm/engine/**', '.github/workflows/m3-engine.yml']

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install nasm + wabt
        run: sudo apt-get update && sudo apt-get install -y nasm wabt
      - name: run verification suite
        run: ./oxwasm/engine/test.sh 300
