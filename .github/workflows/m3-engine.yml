name: m3-engine
# The M3 engine verification suite: differential tests (interpreter oracle vs
# hardware stepper vs AOT wasm, bit-exact) plus every regression the real-app
# work has accumulated (lea sizes, entry-live flags, mul/bt flags, ...), and a
# browser check of what the packer actually produces.
on:
  push:
    paths: ['engine/**', 'tools/**', 'sdk/**', '.github/workflows/m3-engine.yml']
  pull_request:
    paths: ['engine/**', 'tools/**', 'sdk/**', '.github/workflows/m3-engine.yml']

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install nasm + wabt + static busybox
        run: sudo apt-get update && sudo apt-get install -y nasm wabt busybox-static
      - name: run verification suite
        run: ./engine/test.sh 300

  # The in-process sandbox SDK, end to end: state, files, commands, timeouts,
  # isolation, and a runaway loop that has to be contained by its worker.
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install wabt
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: sandbox suite
        run: |
          node engine/diff/sandboxtest.mjs
          node engine/diff/isolationtest.mjs

  # The packer had no check at all, and stayed broken on every machine but one
  # for as long as it took someone to run it somewhere else: it read wabt.js
  # from a path in /tmp that a developer had created by hand. This packs a
  # dynamically-linked binary into a single HTML file, runs it in the runner's
  # own headless Chrome, and compares the terminal it prints against native.
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install wabt.js
        run: npm i --no-save wabt@1.0.39
      - name: the packed page runs the binary in a browser
        run: |
          cp README.md /tmp/oxpage_f
          node tools/pagerun.mjs /usr/bin/sha256sum \
            --arg sha256sum --arg /tmp/oxpage_in --file /tmp/oxpage_in=/tmp/oxpage_f
      # A second case whose stdout is BINARY, and whose bytes depend on file
      # metadata rather than only on the input. sha256sum alone cannot fail
      # this way: the packer shipped every bundled file with a 1970 timestamp,
      # which made gzip warn and exit 2, and even once that was fixed the two
      # sides still differed in the four header bytes that hold the mtime -
      # 16,788 bytes on each side, same length, different content. A text or
      # length comparison sees neither.
      - name: and one whose output is binary
        run: |
          node tools/pagerun.mjs /bin/gzip \
            --arg gzip --arg -9 --arg -c --arg /tmp/oxpage_gzin \
            --file /tmp/oxpage_gzin=/tmp/oxpage_f
